name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # 用部署时的子路径构建一遍，确保线上路径没有问题
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /AiFei/
